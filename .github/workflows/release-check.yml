name: Check Bitcoin Core Releases

on:
  workflow_dispatch:

jobs:
  check_releases:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: Get official releases and current releases
        id: versions
        env:
          # Authenticate the GitHub API reads. Unauthenticated calls share a
          # 60 req/h-per-IP budget on shared runners and intermittently return
          # a non-JSON error body. That alone wasn't enough: even
          # authenticated, GitHub occasionally hands back a transient
          # non-JSON body (rate limit / abuse-detection page), which made
          # `jq` fail with an opaque "Invalid numeric literal" and gave no
          # clue what was actually returned. fetch_json() below retries a
          # few times and validates the body is real JSON before use, and
          # logs the HTTP status + a snippet of the bad body on failure so a
          # future break is diagnosable instead of a bare crash.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          fetch_json() {
            local url="$1" attempt response http_code body
            for attempt in 1 2 3; do
              response="$(curl -sS -w '\n%{http_code}' \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "$url" 2>/dev/null || true)"
              http_code="${response##*$'\n'}"
              body="${response%$'\n'*}"
              if [ "$http_code" = "200" ] && jq empty >/dev/null 2>&1 <<<"$body"; then
                printf '%s' "$body"
                return 0
              fi
              echo "::warning::Attempt $attempt/3 failed for $url (HTTP ${http_code:-none}): $(head -c 200 <<<"$body")" >&2
              sleep $((attempt * 2))
            done
            return 1
          }

          OFFICIAL_JSON=$(fetch_json "https://api.github.com/repos/bitcoin/bitcoin/releases?per_page=100") \
            || { echo "Can't fetch official releases!"; exit 1; }
          OFFICIAL_VERSIONS=$(jq -r '.[].tag_name' <<<"$OFFICIAL_JSON" \
            | grep -E '^v(2[8-9]|[3-9][0-9])\.[0-9]+(\.[0-9]+)?$' \
            | grep -vE 'rc[0-9]+$' \
            | sed 's/^v//' \
            | sort -V \
            | tr '\n' ' ')

          LATEST_JSON=$(fetch_json "https://api.github.com/repos/bitcoin/bitcoin/releases/latest") \
            || { echo "Can't fetch latest release!"; exit 1; }
          LATEST_VERSION=$(jq -r '.tag_name' <<<"$LATEST_JSON" | sed 's/^v//')

          CURRENT_JSON=$(fetch_json "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100") \
            || { echo "Can't fetch current releases!"; exit 1; }
          CURRENT_VERSIONS=$(jq -r '.[].tag_name' <<<"$CURRENT_JSON" \
            | sed 's/^v//' \
            | sort -V \
            | tr '\n' ' ')

          if [ -z "$OFFICIAL_VERSIONS" ] || [ -z "$LATEST_VERSION" ]; then
            echo "Can't fetch releases!"
            exit 1
          fi

          {
            echo "OFFICIAL_VERSIONS=$OFFICIAL_VERSIONS"
            echo "LATEST_VERSION=$LATEST_VERSION"
            echo "CURRENT_VERSIONS=$CURRENT_VERSIONS"
          } >> "$GITHUB_OUTPUT"

      - name: Determine versions to build
        id: determine_builds
        env:
          OFFICIAL_VERSIONS: ${{ steps.versions.outputs.OFFICIAL_VERSIONS }}
          CURRENT_VERSIONS: ${{ steps.versions.outputs.CURRENT_VERSIONS }}
        run: |
          VERSIONS_TO_BUILD=""
          for v in $OFFICIAL_VERSIONS; do
            if [[ " $CURRENT_VERSIONS " != *" $v "* ]]; then
              VERSIONS_TO_BUILD="$VERSIONS_TO_BUILD $v"
            fi
          done

          if [ -z "$VERSIONS_TO_BUILD" ]; then
            echo "No new versions to build."
            exit 0
          fi

          echo "VERSIONS_TO_BUILD=$VERSIONS_TO_BUILD" >> "$GITHUB_OUTPUT"

      - name: Trigger builds for new versions
        env:
          VERSIONS_TO_BUILD: ${{ steps.determine_builds.outputs.VERSIONS_TO_BUILD }}
          LATEST_VERSION: ${{ steps.versions.outputs.LATEST_VERSION }}
        run: |
          for v in $VERSIONS_TO_BUILD; do
            if [ "$v" == "$LATEST_VERSION" ]; then
              LATEST_FLAG=true
            else
              LATEST_FLAG=false
            fi

            echo "Triggering build for version $v (LATEST=$LATEST_FLAG)"
            curl -sS --fail-with-body -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              https://api.github.com/repos/${{ github.repository }}/actions/workflows/build-docker.yml/dispatches \
              -d "{\"ref\":\"main\",\"inputs\":{\"VERSION\":\"v$v\",\"LATEST\":\"$LATEST_FLAG\"}}"
          done
